name: Build y publicar APK

# Se dispara con cada push a main: compila el APK debug (firmado con la
# llave fija de keystore/wakeup-sideload.jks) y lo publica como GitHub
# Release. La app puede revisar el release más reciente desde Ajustes →
# Buscar actualizaciones sin que haya que pasar el APK a mano cada vez.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.1.${{ github.run_number }}

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Wake up · build ${{ github.run_number }}"
          body: |
            Build automática desde el commit ${{ github.sha }}.
            Instálala directo en tu Android: descarga el .apk de abajo y ábrelo,
            o usa "Buscar actualizaciones" dentro de la app.
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
